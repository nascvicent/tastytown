<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview de Interiores</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1d1626; --fg: #fff; --chip: #ffffff22; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Fredoka One", system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 20px); }
  #ui button { background: var(--chip); color: var(--fg); border: 1px solid #ffffff44; border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #ui button.on { background: #e83e46; }
  #info { position: fixed; bottom: 10px; left: 10px; font-size: 13px; opacity: .8; z-index: 2; }
  canvas { display: block; }
</style>
<!-- Gerado por: lune run tools/interiors/build.luau -->
<script>document.write('<script src="scene.js?v=' + Date.now() + '"><\/script>');</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui"></div>
<div id="info"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1626);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Luz base parecida com a do Roblox (ambiente + sol)
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a9a, 1.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.2);
sun.position.set(-60, 120, -40);
scene.add(sun);

// ?scene=CandyMansionInterior escolhe a cena; padrão: a primeira
const sceneParam = new URLSearchParams(location.search).get("scene");
const data = (window.SCENES || []).find((sc) => sc.name === sceneParam) || (window.SCENES || [])[0];
if (!data) { document.getElementById("info").textContent = "Rode: lune run tools/interiors/build.luau"; throw new Error("sem cena"); }

// Prisma do WedgePart: rampa subindo de frente-baixo (-Z) para trás-cima (+Z)
function wedgeGeometry(sx, sy, sz) {
  const x = sx / 2, y = sy / 2, z = sz / 2;
  const v = [
    [-x, -y, -z], [x, -y, -z], [-x, -y, z], [x, -y, z], [-x, y, z], [x, y, z],
  ];
  const faces = [
    [0, 2, 1], [1, 2, 3],       // base
    [2, 4, 3], [3, 4, 5],       // traseira
    [0, 1, 4], [1, 5, 4],       // rampa
    [0, 4, 2], [1, 3, 5],       // laterais
  ];
  const pos = [];
  for (const f of faces) for (const i of f) pos.push(...v[i]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function material(p) {
  const color = new THREE.Color().setRGB(p.col[0], p.col[1], p.col[2], THREE.SRGBColorSpace);
  if (p.m === "Neon") {
    const c = color.clone().multiplyScalar(1.6);
    return new THREE.MeshBasicMaterial({ color: c, transparent: p.t > 0, opacity: 1 - p.t, depthWrite: p.t < 0.5 });
  }
  const glass = p.m === "Glass";
  const opacity = 1 - p.t;
  return new THREE.MeshStandardMaterial({
    color, roughness: glass ? 0.1 : 0.85, metalness: 0,
    transparent: opacity < 1 || glass, opacity: glass ? Math.min(opacity, 0.45) : opacity,
    depthWrite: opacity > 0.6,
  });
}

const meshes = [];
const showHidden = location.hash.includes("debug");
for (const p of data.parts) {
  if (p.t >= 1 && !showHidden) { meshes.push(null); continue; }
  const [sx, sy, sz] = p.s;
  let geo;
  if (p.c === "WedgePart") geo = wedgeGeometry(sx, sy, sz);
  else if (p.sh === "Cylinder") { geo = new THREE.CylinderGeometry(Math.min(sy, sz) / 2, Math.min(sy, sz) / 2, sx, 20); geo.rotateZ(Math.PI / 2); }
  else if (p.sh === "Ball") geo = new THREE.SphereGeometry(Math.min(sx, sy, sz) / 2, 14, 10);
  else geo = new THREE.BoxGeometry(sx, sy, sz);
  const mat = p.t >= 1 ? new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true }) : material(p);
  const mesh = new THREE.Mesh(geo, mat);
  const c = p.cf;
  const m = new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
  mesh.applyMatrix4(m);
  mesh.castShadow = mesh.receiveShadow = p.m !== "Neon" && p.t < 0.5;
  mesh.userData.name = p.n;
  mesh.userData.group = p.g;
  scene.add(mesh);
  meshes.push(mesh);
}

// SurfaceGuis como texturas de canvas numa placa colada à face
const FACE = {
  Front: { n: [0, 0, -1], rot: [0, Math.PI, 0], dims: (s) => [s[0], s[1]], off: (s) => s[2] / 2 },
  Back: { n: [0, 0, 1], rot: [0, 0, 0], dims: (s) => [s[0], s[1]], off: (s) => s[2] / 2 },
  Right: { n: [1, 0, 0], rot: [0, Math.PI / 2, 0], dims: (s) => [s[2], s[1]], off: (s) => s[0] / 2 },
  Left: { n: [-1, 0, 0], rot: [0, -Math.PI / 2, 0], dims: (s) => [s[2], s[1]], off: (s) => s[0] / 2 },
  Top: { n: [0, 1, 0], rot: [-Math.PI / 2, 0, 0], dims: (s) => [s[0], s[2]], off: (s) => s[1] / 2 },
  Bottom: { n: [0, -1, 0], rot: [Math.PI / 2, 0, 0], dims: (s) => [s[0], s[2]], off: (s) => s[1] / 2 },
};
// O serde do Lune exporta listas vazias como {}
const arr = (x) => Array.isArray(x) ? x : Object.values(x || {});
const css = (c) => `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`;

function drawGui(g, p) {
  const f = FACE[g.f];
  const [w, h] = f.dims(p.s);
  const scale = 48;
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(8, Math.round(w * scale));
  canvas.height = Math.max(8, Math.round(h * scale));
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = css(g.bg); ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const fr of arr(g.frames)) {
    ctx.fillStyle = css(fr.col);
    const x = fr.x * canvas.width, y = fr.y * canvas.height, ww = fr.w * canvas.width, hh = fr.h * canvas.height;
    ctx.beginPath();
    if (fr.round) ctx.roundRect(x, y, ww, hh, Math.min(ww, hh) / 2); else ctx.rect(x, y, ww, hh);
    ctx.fill();
  }
  for (const l of arr(g.lines)) {
    const bx = l.x * canvas.width, by = l.y * canvas.height, bw = l.w * canvas.width, bh = l.h * canvas.height;
    let size = bh * 0.92;
    ctx.font = `${size}px "Fredoka One"`;
    while (ctx.measureText(l.text).width > bw && size > 4) { size *= 0.94; ctx.font = `${size}px "Fredoka One"`; }
    ctx.textBaseline = "middle";
    ctx.textAlign = l.align === "Left" ? "left" : l.align === "Right" ? "right" : "center";
    const tx = l.align === "Left" ? bx : l.align === "Right" ? bx + bw : bx + bw / 2;
    if (l.stroke) { ctx.lineWidth = Math.max(2, size * 0.08); ctx.strokeStyle = css(l.stroke); ctx.strokeText(l.text, tx, by + bh / 2); }
    ctx.fillStyle = css(l.col); ctx.fillText(l.text, tx, by + bh / 2);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  plane.rotation.set(...f.rot);
  plane.position.set(f.n[0] * (f.off(p.s) + 0.03), f.n[1] * (f.off(p.s) + 0.03), f.n[2] * (f.off(p.s) + 0.03));
  meshes[g.p]?.add(plane);
}

// Luzes pontuais (as mais fortes, para não pesar)
for (const l of [...arr(data.lights)].sort((a, b) => b.r * b.b - a.r * a.b).slice(0, 24)) {
  const light = new THREE.PointLight(new THREE.Color().setRGB(...l.col), l.b * 60, l.r * 1.6, 1.6);
  light.position.set(...l.pos);
  scene.add(light);
}

// Bonecos de referência com a altura dos personagens do jogo (~3,7 studs), só no preview.
// Posições em medidas de projeto (multiplicadas pela escala do build).
const CHAR_HEIGHT = 3.7;
const REFS = (data.name === "CandyMansionInterior" || data.name === "SushiHouseInterior" || data.name === "CasaDeBiscoitoInterior") ? [[12, 1, -12], [-3, 13, 6], [-19, 7, -6]] : [[2, 0, 10], [-23.5, 0, 18], [-14, -1.2, 58.6]];
for (const [x, y, z] of REFS) {
  const k = data.scale || 1;
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.75, CHAR_HEIGHT - 1.5 - 1.6, 4, 12), new THREE.MeshStandardMaterial({ color: 0xc8743c }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 12), new THREE.MeshStandardMaterial({ color: 0xd98a4c }));
  body.position.set(x * k, y * k + (CHAR_HEIGHT - 1.6) / 2, z * k);
  head.position.set(x * k, y * k + CHAR_HEIGHT - 0.8, z * k);
  scene.add(body, head);
}

// Câmeras prontas (posição, alvo) por cena
const VIEWS_BY_SCENE = {};
VIEWS_BY_SCENE.CineCornInterior = {
  entrada: [[0, 9, 4], [0, 6, 30]],
  lobby: [[22, 20, 2], [-6, 4, 22]],
  lanchonete: [[-10, 10, 12], [-30, 6, 18]],
  bilheteria: [[12, 9, 24], [32, 6, 15]],
  patamar: [[0, 8, 40], [0, 2, 100]],
  tela: [[0, 4, 70], [0, 8, 120]],
  palco: [[18, 6, 98], [-6, -2, 112]],
  poltronas: [[30, 6, 100], [0, -4, 70]],
  cima: [[0, 230, 60], [0, 0, 60]],
};
// Casa: "iso" reproduz a câmera do HouseController (altura 25, distância 20, 315°) com o jogador no spawn
// Vistas terminadas em "Terreo" escondem o AndarSuperior (como o FloorCutawayController no jogo)
VIEWS_BY_SCENE.CandyMansionInterior = {
  isoTerreo: [[12 + 14.1, 1 + 25, -12 - 14.1], [12, 6, -12]],
  tvTerreo: [[4 + 14.1, 1 + 25, 8 - 14.1], [4, 6, 8]],
  isoCama: [[-10 + 14.1, 13 + 25, 8 - 14.1], [-10, 18, 8]],
  isoEscada: [[-16 + 14.1, 7 + 25, -8 - 14.1], [-16, 12, -8]],
  geral: [[50, 52, -50], [0, 8, 0]],
  geralTerreo: [[50, 52, -50], [0, 4, 0]],
};
VIEWS_BY_SCENE.SushiHouseInterior = VIEWS_BY_SCENE.CandyMansionInterior;
// Casa de Biscoito: um andar, spawn em (9, 1, -9)
VIEWS_BY_SCENE.CasaDeBiscoitoInterior = {
  iso: [[9 + 14.1, 1 + 25, -9 - 14.1], [9, 6, -9]],
  isoCama: [[-10 + 14.1, 1 + 25, 8 - 14.1], [-10, 6, 8]],
  geral: [[42, 44, -42], [0, 4, 0]],
};
const VIEWS = VIEWS_BY_SCENE[data.name] || VIEWS_BY_SCENE.CineCornInterior;
function setView(name) {
  const v = VIEWS[name] || Object.values(VIEWS)[0];
  const k = data.scale || 1; // vistas estão em medidas de projeto; acompanham a escala do build
  camera.position.set(...v[0].map((n) => n * k));
  controls.target.set(...v[1].map((n) => n * k));
  // Na vista de cima esconde os tetos
  for (const m of meshes) {
    if (!m) continue;
    if (m.userData.name?.startsWith("Teto")) m.visible = name !== "cima";
    if (m.userData.group === "AndarSuperior") m.visible = !name.endsWith("Terreo");
  }
  controls.update();
  document.querySelectorAll("#ui button").forEach((b) => b.classList.toggle("on", b.dataset.v === name));
  history.replaceState(null, "", location.search + "#" + name + (showHidden ? "-debug" : ""));
}
const ui = document.getElementById("ui");
for (const name of Object.keys(VIEWS)) {
  const b = document.createElement("button");
  b.textContent = name; b.dataset.v = name;
  b.onclick = () => setView(name);
  ui.appendChild(b);
}
window.setView = setView;
// Captura em resolução fixa (independe do tamanho da janela) e salva via POST /snapshot
window.snap = async (name, w = 1000, h = 700) => {
  const old = new THREE.Vector2(); renderer.getSize(old);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const blob = await new Promise((r) => renderer.domElement.toBlob(r, "image/png"));
  renderer.setSize(old.x, old.y, false); camera.aspect = old.x / old.y; camera.updateProjectionMatrix();
  const res = await fetch("/snapshot?name=" + encodeURIComponent(name), { method: "POST", body: blob });
  return res.text();
};
// Para inspecionar ângulos livres pelo console: lookFrom([x,y,z],[x,y,z]) em medidas de projeto
window.lookFrom = (pos, target) => { const k = data.scale || 1; camera.position.set(...pos.map((n) => n * k)); controls.target.set(...target.map((n) => n * k)); controls.update(); };

document.fonts.load('40px "Fredoka One"').finally(() => {
  for (const g of arr(data.guis)) drawGui(g, data.parts[g.p]);
});
document.getElementById("info").textContent = `${data.name}: ${data.parts.length} peças • arraste para orbitar`;
setView(location.hash.replace("#", "").replace("-debug", "") || Object.keys(VIEWS)[0]);

addEventListener("hashchange", () => setView(location.hash.replace("#", "").replace("-debug", "")));
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
